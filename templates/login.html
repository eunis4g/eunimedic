<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>로그인</title>
    <script src="{{ url_for('static', filename='js/script.js') }}" defer></script>
</head>

<body>

    <h1>로그인</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <section aria-label="알림 메시지">
                {% for category, message in messages %}
                    <p role="{{ 'alert' if category == 'error' else 'status' }}">
                        {{ message }}
                    </p>
                {% endfor %}
            </section>
        {% endif %}
    {% endwith %}

    <form action="{{ url_for('login') }}" method="POST">
        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}"
        >

        <label for="login-username">아이디</label>
        <input
            id="login-username"
            type="text"
            name="username"
            value="{{ username }}"
            autocomplete="username"
            required
        >

        <label for="login-password">비밀번호</label>
        <div>
            <input
                id="login-password"
                type="password"
                name="password"
                autocomplete="current-password"
                required
            >
            <button
                type="button"
                data-password-reveal
                aria-controls="login-password"
                aria-label="비밀번호 보기"
            >보기</button>
        </div>

        <button type="submit">로그인</button>
    </form>

    <p><a href="{{ url_for('register') }}">회원가입 페이지로 이동</a></p>

</body>

</html>
