<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <title>이메일 인증</title>
    <script src="{{ url_for('static', filename='js/script.js') }}" defer></script>
</head>

<body>

    <h1>이메일 인증</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <section aria-label="알림 메시지">
                {% for category, message in messages %}
                    <p role="{{ 'alert' if category == 'error' else 'status' }}">
                        {{ message }}
                    </p>
                {% endfor %}
            </section>
        {% endif %}
    {% endwith %}

    <p>{{ masked_email }} 주소로 인증번호를 발송했습니다.</p>
    <p>인증번호는 5분 동안 유효합니다.</p>

    <form
        action="{{ url_for('verify_email', token=token) }}"
        method="POST"
    >
        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}"
        >

        <label for="verification-code">6자리 인증번호</label>
        <input
            id="verification-code"
            type="text"
            name="verification_code"
            inputmode="numeric"
            pattern="[0-9]{6}"
            minlength="6"
            maxlength="6"
            autocomplete="one-time-code"
            required
        >

        <button type="submit">인증하기</button>
    </form>

    <form
        action="{{ url_for('resend_verification_email', token=token) }}"
        method="POST"
    >
        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}"
        >

        <button
            id="resend-verification-button"
            type="submit"
            data-remaining-seconds="{{ resend_remaining_seconds }}"
            {% if resend_remaining_seconds > 0 %}disabled{% endif %}
        >
            {% if resend_remaining_seconds > 0 %}
                인증메일 재전송 ({{ resend_remaining_seconds }}초)
            {% else %}
                인증메일 재전송
            {% endif %}
        </button>
    </form>

</body>

</html>
